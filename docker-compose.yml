# Opcional: base de datos PostgreSQL local sin instalar nada (docker compose up -d)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vida_salud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
