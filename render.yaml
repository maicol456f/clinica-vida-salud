# Blueprint opcional de Render (New + > Blueprint). También puede crear cada servicio a mano.
databases:
  - name: vida-salud-db
    databaseName: vida_salud
    user: vida_salud_user
services:
  - type: web
    name: vida-salud-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: vida-salud-db, property: connectionString }
      - key: APP_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_INTENTOS
        value: "3"
      - key: LOCKOUT_MINUTES
        value: "0"
  - type: web
    name: vida-salud-web
    runtime: static
    rootDir: frontend
    buildCommand: echo "sin build"
    staticPublishPath: .
